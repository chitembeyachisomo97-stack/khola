name: Build KHOLA Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "app.py"
      - "config.py"
      - "db.py"
      - "requirements.txt"
      - "templates/**"
      - "static/**"
      - "desktop/**"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get KHOLA source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pywebview pyinstaller

      - name: Build standalone KHOLA EXE
        run: |
          pyinstaller --clean --onefile --windowed --name KHOLA --paths . --add-data "templates;templates" --add-data "static;static" --collect-all webview desktop/khola_desktop.py

      - name: Upload KHOLA EXE
        uses: actions/upload-artifact@v4
        with:
          name: KHOLA-Windows-EXE
          path: dist/KHOLA.exe
          if-no-files-found: error
