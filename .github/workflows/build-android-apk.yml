name: Build KHOLA Offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'config.py'
      - 'db.py'
      - 'requirements.txt'
      - 'templates/**'
      - 'static/**'
      - 'mobile/android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare KHOLA Python files and assets
        run: |
          mkdir -p mobile/android/app/src/main/python
          mkdir -p mobile/android/app/src/main/assets/khola

          cp app.py config.py db.py mobile/android/app/src/main/python/

          rm -rf mobile/android/app/src/main/assets/khola/templates
          rm -rf mobile/android/app/src/main/assets/khola/static

          cp -r templates mobile/android/app/src/main/assets/khola/
          cp -r static mobile/android/app/src/main/assets/khola/

          cp requirements.txt mobile/android/app/requirements.txt

      - name: Generate Gradle wrapper
        working-directory: mobile/android
        run: gradle wrapper --gradle-version 8.9

      - name: Build standalone APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload KHOLA APK
        uses: actions/upload-artifact@v4
        with:
          name: KHOLA-Offline-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
