plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.khola.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.khola.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"

        pip {
            install "-r", "requirements.txt"
        }
    }
}
